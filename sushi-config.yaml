# sushi-config.yaml — Oral Health Data Exchange (ODE) Implementation Guide
#
# FSH-only IG. SUSHI compiles input/fsh/ -> fsh-generated/; the HL7 IG Publisher
# (./_build.sh) turns that into the published site + NPM package. There is no
# hand-maintained OpenAPI/Swagger view to keep in sync.

id: ohia.ode
canonical: https://oralhealthalliance.net/fhir
name: ODE
title: "Oral Health Data Exchange (ODE) Implementation Guide"
description: >-
  USCDI + Dental: an oral-health data model that inherits from US Core, with three
  directional referral profiles (medical->dental, dental->dental, dental->medical)
  over an HL7 Clinical Order Workflows (COW) Task backbone, plus a claims-submission
  interface (split Claim profiles + $submit) for dental-for-medical billing.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
# Confirm the IG content license with OHIA. CC0-1.0 is the HL7 default and applies to
# the IG's own text — it does NOT relicense referenced code systems (CDT is ADA-licensed;
# X12 artifacts are X12 IP — both are referenced, never reproduced).
license: CC0-1.0
jurisdiction: urn:iso:std:iso:3166#US

publisher:
  name: Oral Health Interoperability Alliance (OHIA)
  url: https://oralhealthalliance.net

dependencies:
  # REQUIRED — profiles inherit US Core 6.1.0 (us-core-servicerequest, us-core-observation-*, etc.).
  hl7.fhir.us.core: 6.1.0
  # REQUIRED — the referral workflow backbone. ODEReferralTask inherits the COW Task profile;
  # the three ServiceRequests stay on US Core with COW conformance carried by the Task.
  # Ballot pin matches the ode-360x-adapter (COW_VERSION). Re-pin when COW publishes.
  hl7.fhir.uv.cow: 1.0.0-ballot
  # REMOVED — hl7.fhir.us.carin-bb. The EOB profile (ODEDentalClaim) was deleted; nothing
  # else uses C4BB. Do not reintroduce.
  #
  # OPTIONAL — needed only if instances/search-and-subscription.fsh keeps the SubscriptionTopic
  # on R4. Add the Topic-based Subscriptions Backport, or comment the SubscriptionTopic out:
  # hl7.fhir.uv.subscriptions-backport.r4: 1.1.0
  #
  # OPTIONAL — only if you reference Da Vinci CRD's coverage-information extension as an allowed
  # sibling slice on the referral (the linkage extension is modeled after it):
  # hl7.fhir.us.davinci-crd: 2.0.0

# NOTE ON TERMINOLOGY CANONICALS (intentional — do not "fix"):
#   Profiles / extensions / capabilities publish under `canonical`
#   (https://oralhealthalliance.net/fhir).
#   CodeSystems / ValueSets publish under the OHIA codes namespace (http://ohia-codes.org)
#   via an explicit ^url in terminology/terminology.fsh. SUSHI warns that these differ
#   from `canonical`; that warning is expected.

parameters:
  show-inherited-invariants: false

# Minimal, safe menu. index.html comes from input/pagecontent/index.md; artifacts.html and
# downloads.html are auto-generated by the Publisher. Add narrative pages (e.g. referrals.md,
# claims.md in input/pagecontent/) and matching menu entries as the IG grows.
menu:
  Home: index.html
  Artifacts: artifacts.html
  Downloads: downloads.html
